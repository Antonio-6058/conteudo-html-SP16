<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Aula09 html</title>
</head>
<body>
    <h1>Imagens em html</h1>

    <h2>exemplo de imagem</h2>
    <!-- src=caminho da imagem(arquivo adicionado a pasta do projeto)
     alt=texto alternativo da imagem caso a imagem não carregue
     width=largura height=altura -->
    <img src="wp3919714.jpg" alt="image album daniel caesar" width="270
    " height="398">

    <hr>
    <h3>Alterando tamanho de imagem com CSS</h3>
    <img src="wp3919714.jpg" alt="image album daniel caesar" style="width: 240px; height: 368px;">
    <!-- style=CSS inline -->

    <hr>

    <h3>Definindo imagens localizadas em outra pasta</h3>
    <img src="/Aula09/img/hamb.png" alt="image album daniel caesar" style="width: 290px; height: 290px;">

    <h2>Imagem com gif</h2>
    <img src="/Aula09/img/program.gif" alt="image album daniel caesar" style="width: 90px; height: 90px;">

    <hr>

    <h3>Definindo imagens dinâmicas no html</h3>
    <img src="/Aula09/img/cat.gif" alt="image burguer" style="width: 70px; height: 70px;">

    <hr>

    <h3>Imagens flutuantes no html</h3>

    <p>
        <img src="/Aula09/img/hamb.png" style="float: right; width: 90px; height: 90px;">
        Somente a dor coletiva gera união;
    </p>
</body>
</html>
