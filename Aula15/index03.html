<!DOCTYPE html>
<html lang="pt-br">
<head>
    <!-- aceita caracteres especiais -->
    <meta charset="UTF-8">
    <!-- palavras chave -->
    <meta name="keywords" content="CSS,HTML,JavaScript">
    <!-- descrição da página-->
     <meta name="description" content="Pagina de estudo de HTML no curso transforme-se">
     <!-- autor da página -->
     <meta name="author" content="Tonyo">
     <!-- atualizar a página a cada 30 segundos -->
     <!-- <meta name="refresh" content="30"> -->
      <!-- redirecionar para outro endereço -->
     <!-- <meta http-equiv="refresh" content="0"; url="https://www.youtube.com/watch?v=VcV00GDAjaY&list=RD8GPaRce9aBI&index=5"> -->
     <meta http-equiv="X-UA-Compatible" content="IE=edge">

     <meta name="viewport" content="width=device-width, initial-scale=1.0">

     <script>

    function adicionandoConteudo(){
        document.getElementById("meu-paragrafo").innerHTML = "Somente a dor coletiva gera união.";
    }


        </script>


    <title>Aula15 html03</title>
</head>
<body>
    <h1>Sessão head no html</h1>
    <h3>aprendendo sobre a meta tag viewport</h3>
    <img src="Lapagado.gif" style="width: 100px; height: 180px" />
    <p>lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam, quod.</p>

    <hr>

    <h3>JavaScript na head do html</h3>

    <p id="meu-paragrafo"></p>

    <button onclick="adicionandoConteudo()">Clique aqui</button>


</body>
</html>
